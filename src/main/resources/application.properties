spring.application.name=dimdim
app.versao=1.0.0

# Porta: o App Service (Linux / Java SE) injeta SERVER_PORT=80 via App Settings
server.port=${SERVER_PORT:8080}

# Conexao com o Azure SQL vem SOMENTE de variaveis de ambiente (App Settings do Web App).
# Nenhuma senha fica no codigo:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# O schema e criado pelo script.sql (DDL), o Hibernate nao altera nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
