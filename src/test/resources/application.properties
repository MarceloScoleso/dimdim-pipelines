spring.application.name=dimdim-test
app.versao=1.0.0
# Testes do CI rodam com H2 em memoria (modo SQL Server), sem tocar no banco da nuvem
spring.datasource.url=jdbc:h2:mem:dimdim;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
